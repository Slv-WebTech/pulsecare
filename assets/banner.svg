<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="PulseCare: care that keeps its own rhythm">
  <title>PulseCare</title>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073430"/>
      <stop offset="1" stop-color="#0D6E62"/>
    </linearGradient>
    <linearGradient id="bn-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0A4F46"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bn-bg)"/>
  <rect width="1280" height="320" fill="url(#bn-glow)"/>
  <!-- ECG trace -->
  <polyline fill="none" stroke="#A7F3D0" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="0,262 150,262 178,214 214,300 250,236 270,262 430,262 458,214 494,300 530,236 550,262 710,262 738,214 774,300 810,236 830,262 990,262 1018,214 1054,300 1090,236 1110,262 1280,262"/>
  <!-- mark -->
  <g transform="translate(96 82) scale(2.1)">
