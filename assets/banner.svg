    <path d="M32 51C14 39 10 30 10 24C10 18 14.5 14 20 14C25 14 29.5 16.5 32 21C34.5 16.5 39 14 44 14C49.5 14 54 18 54 24C54 30 50 39 32 51Z" fill="#fff"/>
    <polyline points="13,31 23,31 27,23 33,40 38,27 41,31 51,31" fill="none" stroke="#0B5D52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="262" y="156" font-size="82" font-weight="800" fill="#fff" letter-spacing="-1.5">PulseCare</text>
    <text x="266" y="204" font-size="30" fill="#A7F3D0">Care that keeps its own rhythm.</text>
    <text x="266" y="242" font-size="20" fill="#DCF5F0" fill-opacity="0.85">Appointments &#8226; private records &#8226; secure messaging &#8226; AI summaries that never diagnose</text>
